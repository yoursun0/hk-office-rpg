<!DOCTYPE html>

<head>

<title>香港人最鍾意返工｜永續加班大廈</title>
<style>
:root{color-scheme:dark;--ink:#0a1020;--paper:#e7e7d9;--fog:#8fa9b7;--gold:#e8bb75;--blood:#d57c89;--jade:#85d4c0}*{box-sizing:border-box}body{margin:0;background:#080d17;color:var(--paper);font-family:"Microsoft JhengHei","PingFang HK",sans-serif;overflow:hidden}button,select{font:inherit}button{cursor:pointer;color:var(--paper);border:1px solid #617580;background:#182936;padding:12px 24px;transition:.18s}button:hover{background:#31444c;border-color:var(--gold)}button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button.primary{background:#e8bb75;color:#15202b;border-color:#e8bb75;font-weight:bold}button:disabled{opacity:.35;cursor:default}#frame{position:relative;width:100vw;height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse,#152537,#080d17 75%)}canvas{display:block;width:min(100vw,177.7778dvh);height:min(56.25vw,100dvh);touch-action:none}#screen{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:#060c1480}#screen.hidden{display:none}.panel{pointer-events:auto;width:min(710px,92vw);max-height:90dvh;overflow:auto;background:linear-gradient(145deg,#152430ed,#0b1420f5);border:1px solid #60778180;padding:36px 40px;box-shadow:0 22px 90px #0008;position:relative}.panel:before{content:"";position:absolute;top:0;left:32px;right:32px;height:2px;background:linear-gradient(90deg,transparent,#e8bb75,transparent)}.eyebrow{color:var(--gold);letter-spacing:4px;font-size:12px;margin:0 0 14px}h1{font-family:"PMingLiU","Songti TC",serif;font-weight:400;font-size:clamp(30px,5vw,57px);line-height:1.15;letter-spacing:3px;margin:8px 0 14px}h2{font-family:"PMingLiU","Songti TC",serif;font-size:30px;font-weight:400;margin:4px 0 20px}.lede{line-height:1.9;color:#bacad1;font-size:15px}.quote{border-left:2px solid var(--gold);padding-left:18px;line-height:1.85;margin:24px 0;color:#e4d8bb}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.small{font-size:12px;color:#91a7b4;line-height:1.7}.keys{display:flex;gap:15px;flex-wrap:wrap;padding-top:20px;border-top:1px solid #41505c;margin-top:22px;font-size:12px;color:#a9bec8}kbd{color:var(--paper);border:1px solid #627581;border-bottom:3px solid #627581;padding:2px 6px;margin-right:4px;font-family:inherit}select{background:#142330;color:#dce2de;border:1px solid #566773;padding:10px}.choice{display:block;text-align:left;width:100%;margin:12px 0;padding:17px 20px}.choice strong{display:block;color:var(--gold);margin-bottom:8px}.choice span{display:block;font-size:13px;line-height:1.7;color:#b3c7cd}.badge{color:var(--jade);font-size:13px}.touch{position:absolute;inset:auto 12px 12px;display:none;justify-content:space-between;pointer-events:none}.touch-group{display:flex;gap:8px;align-items:flex-end}.touch button{pointer-events:auto;touch-action:none;width:54px;height:54px;padding:0;background:#112333b8;border-radius:50%;font-size:13px;user-select:none;-webkit-user-select:none}.touch button.big{width:66px;height:66px;border-color:#e8bb75}.touch.show{display:flex}#toptools{position:absolute;right:18px;top:12px;display:flex;gap:8px}#toptools button{font-size:12px;padding:8px 11px;background:#0a1726a0}#rotate{display:none}@media(max-height:600px){.panel{padding:22px 30px}.lede{font-size:13px;line-height:1.6}h1{font-size:32px}.quote{margin:14px 0}.keys{margin-top:14px;padding-top:12px}}@media (orientation:portrait) and (max-width:700px){#rotate{display:block;position:absolute;bottom:85px;font-size:12px;color:#a9bec8}.panel{padding:25px}.keys{gap:10px}#toptools{top:8px;right:8px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>

<body>
<main id="frame">
<canvas id="game" width="1280" height="720" aria-label="香港人最鍾意返工：鍵盤或觸控操作的動作 RPG">請使用支援 Canvas 2D 的瀏覽器。</canvas>
<div id="toptools"><button id="sound" aria-label="切換背景音樂及音效">聲音：關</button><button id="pause">暫停 / 操作</button></div>
<div id="screen"><section class="panel" id="panel" aria-live="polite"></section></div>
<div class="touch" id="touch"><div class="touch-group"><button data-key="ArrowLeft" aria-label="向左移動">◀</button><button data-key="ArrowRight" aria-label="向右移動">▶</button></div><div class="touch-group"><button data-key="KeyC">咖啡</button><button data-key="KeyQ">收工</button><button data-key="ShiftLeft">閃避</button><button data-key="Space">跳</button><button data-key="KeyE">互動</button><button class="big" data-key="KeyJ">攻擊</button></div></div>
<span id="rotate">橫向畫面可睇清整個辦公室</span>
</main>
<script>
'use strict';
// Artwork and instruments are procedural. CC0 MIDI scores are embedded below; no runtime network or libraries.
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const screen=document.getElementById('screen'),panel=document.getElementById('panel');
const W=1280,H=720,FLOOR=596,WORLD=2280,SAVE_KEY='hk-office-rpg-v1';
const C={ink:'#0a1020',paper:'#e7e7d9',fog:'#8fa9b7',gold:'#e8bb75',blood:'#d57c89',jade:'#85d4c0'};
const keys=new Set(),pressed=new Set();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let mode='title',chapter=0,camera=0,clock=0,elapsed=0,shake=0,hitStop=0,stageTime=0;
let player,enemies=[],shots=[],particles=[],texts=[],hazards=[],pickups=[],decor=[];
let wave=0,waveDelay=3,bossSpawned=false,cleared=false,nextEnemy=0,toast='',toastTime=0,dialogDone=null;
let saveAvailable=false,checkpoint=null,endingChoice='',lastTime=0,audio=null,soundOn=false,musicBus=null,sfxBus=null,masterBus=null,noiseBuffer=null,musicTrack=-1,musicOrigin=0,musicCursor=0,musicLoop=0;
let stats={level:1,xp:0,attack:18,maxHp:120,speed:0,skill:0,coffeeMax:3,submission:0,dignity:0,difficulty:'normal',deaths:0,secrets:0};
let journal=[];
const chapters=[
{floor:'B2',name:'打卡深淵',subtitle:'入職第一日 · 你嘅時間，已經唔係你嘅',color:'#456077',boss:'搶功阿 Ken',role:'「你做嘅，我 present。」',kind:'ken',hp:1500,enemy:'mail',lines:[['旁白','夜晚八點五十九分。觀塘一棟冇出口嘅商廈，仲有一層燈著緊。'],['阿晴','你係新嚟嗰個？我哋明明六點收工，但個打卡鐘永遠停喺五點五十九分。'],['你','我只係想返份工，交租，放假瞓晏啲。'],['阿晴','小心啲。喺度，做得快，只會有人畀更多嘢你做。搵返我哋被收走嘅「放工權」，條電梯先會郁。']],after:[['阿 Ken','大家都係 team 嚟啫，計咁清楚做咩？'],['你','咁你下一次，可唔可以自己做？'],['阿晴','佢個名牌下面，原來壓住你第一封署名電郵。記低：你做嘅，係你做嘅。']],offer:'Ken 留低一張「快速升職表」。第一格，係放棄署名。'},
{floor:'07',name:'抄送墓園',subtitle:'Reply All · 人人有份，冇人負責',color:'#506568',boss:'卸膊主管 May',role:'「我冇叫你咁做喎。」',kind:'may',hp:2100,enemy:'cc',lines:[['旁白','第七層，成排抄送名單像墓碑。每個人都話自己只係「幫手跟一跟」。'],['May','阿 Ken 嘅嘢，你頂住先。deadline 係尋日，做唔切係你 time management 有問題。'],['你','可唔可以先講清楚要求？'],['May','我唔會 micromanage 你。總之做錯，你負責。']],after:[['May','我其實一早都想幫你，但上面唔批。'],['阿晴','佢跌低嘅會議紀錄，寫住所有要求都係佢改嘅。你終於唔使再替佢孭。']],offer:'HR 遞嚟一份「績效改善承諾」：每日自願加班。'},
{floor:'18',name:'績效祭壇',subtitle:'年度評核 · 努力只係下一年嘅起點',color:'#626076',boss:'KPI 祭司',role:'「達標？咁下年加三成。」',kind:'kpi',hp:2800,enemy:'kpi',lines:[['旁白','十八樓，十萬張評核表吊喺天花。每張紙都寫住「有待改善」。'],['KPI 祭司','你跑贏晒人？好。但 budget 只夠畀一個人攞 A。'],['你','我哋互相幫忙，所以成隊都做得好。'],['KPI 祭司','合作唔計分。競爭先會令你哋肯用生命返工。']],after:[['KPI 祭司','冇排名，你哋仲會努力咩？'],['你','原來我一直想做得好，唔係為咗踩低隔籬嗰個。'],['阿晴','你搵返嘅第三塊鐘面，刻住一句：一個人嘅價值，唔係張評核表。']],offer:'祭壇出現一頂管理職皇冠。戴上，就可以叫其他人替你捱。'},
{floor:'28',name:'家庭式刑場',subtitle:'公司係你屋企 · 但屋企唔會扣你糧',color:'#6b5265',boss:'「一家人」總監',role:'「講錢傷感情，OT 講心機。」',kind:'family',hp:3400,enemy:'mail',lines:[['總監','公司當你一家人，你放假仲要同我計？'],['你','屋企人唔會喺星期日凌晨問我份 deck 呢？'],['阿晴','呢度嘅人唔係冇屋企。只係太耐冇返去，連門匙都生鏽。'],['總監','香港人最鍾意返工！你唔鍾意，係你唔夠正面。']],after:[['總監','冇公司，你仲有咩身份？'],['你','朋友。屋企人。自己。唔止員工編號。'],['阿晴','最後一塊鐘面喺頂樓。呢次，唔好將句「我好鍾意返工」講到連自己都信。']],offer:'最後一份晉升信：你終於有資格，成為你曾經憎嘅人。'},
{floor:'99',name:'永續加班王座',subtitle:'最後一分鐘 · 今晚六點，真係可以到來嗎',color:'#675e4a',boss:'永續董事長',role:'「返工係福氣。收工係背叛。」',kind:'chair',hp:4600,enemy:'cc',lines:[['董事長','你一路爬上嚟，唔就係想坐我呢個位？'],['你','我只係想將個鐘，較返六點。'],['董事長','你哋口口聲聲話辛苦。點解第二朝，個個又乖乖返嚟？'],['阿晴','因為要生活。唔代表我哋鍾意被困。'],['你','今日打卡嗰刻，我交出嘅係時間。唔係我成個人。']],after:[['董事長','冇我命令，你哋識做啲咩？'],['旁白','整棟大廈第一次靜落嚟。窗外，巴士仲行緊。你想起一餐未食嘅晚飯。'],['阿晴','而家個鐘，喺你手上。']],offer:''}
];
const upgrades=[
{name:'留底電郵',desc:'公事包傷害 +6。下次搶功，有證據。',apply:()=>stats.attack+=6},
{name:'真係食午飯',desc:'生命上限 +25，並回復生命。',apply:()=>{stats.maxHp+=25;player.hp=Math.min(stats.maxHp,player.hp+55)}},
{name:'同事互助會',desc:'「準時收工」傷害 +18%，範圍 +30。',apply:()=>stats.skill++},
{name:'唔該借借',desc:'步速 +8%；閃避冷卻縮短。',apply:()=>stats.speed++},
{name:'茶記熟客',desc:'咖啡上限 +1；立即補滿咖啡。',apply:()=>{stats.coffeeMax++;player.coffee=stats.coffeeMax}}
];
function show(html,nextMode){mode=nextMode;screen.classList.remove('hidden');panel.innerHTML=html;document.getElementById('touch').classList.remove('show');setTimeout(()=>panel.querySelector('button')?.focus({preventScroll:true}),0)}
function hide(){screen.classList.add('hidden');mode='play';if(matchMedia('(pointer:coarse)').matches)document.getElementById('touch').classList.add('show');keys.clear();pressed.clear()}
function button(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}
function title(){
 let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE_KEY))}catch{}
 saveAvailable=validSave(saved);checkpoint=saveAvailable?saved:null;
 show('<p class="eyebrow">永 續 加 班 大 廈 · OFFICE AFTERLIFE</p><h1>香港人<br>最鍾意返工</h1><p class="lede">一份工。一棟冇出口嘅大廈。一個永遠停喺 5:59 嘅鐘。<br>拎起公事包，打敗衰格同事與卑鄙上司。<br>今次升職，你仲想唔想做返自己？</p><p class="quote">「我唔係鍾意返工。<br>我只係想有一日，可以準時返屋企。」</p><label class="small">戰鬥難度 <select id="difficulty"><option value="normal">正常 · 要識閃招</option><option value="easy">輕鬆 · 睇故事都玩得完</option></select></label><div class="row" id="menuactions"></div><div class="keys"><span><kbd>A D</kbd>移動</span><span><kbd>空白</kbd>跳 / 二段跳</span><span><kbd>J</kbd>連擊</span><span><kbd>Shift</kbd>閃避</span><span><kbd>Q</kbd>收工技</span><span><kbd>C</kbd>咖啡</span><span><kbd>E</kbd>互動</span></div><p class="small">聲音會在開始後播放；右上角可以靜音。<br>原創幽暗奇幻辦公室 · 約 8–12 分鐘 · 五層 Boss · 多結局<br>離線可玩；每層自動存檔。ESC 暫停 / 查看員工手冊。</p>','title');
 document.getElementById('menuactions').append(button('開始返工',()=>newGame(document.getElementById('difficulty').value),'primary'));
 if(saveAvailable)document.getElementById('menuactions').append(button('繼續 · '+chapters[saved.chapter].name,()=>loadSave(saved)));
}
function validSave(s){return s&&s.version===1&&Number.isInteger(s.chapter)&&s.chapter>=0&&s.chapter<5&&s.stats&&Object.keys(stats).every(k=>k==='difficulty'?['normal','easy'].includes(s.stats[k]):Number.isFinite(s.stats[k])&&s.stats[k]>=0)&&s.stats.maxHp>=100&&s.stats.maxHp<=1000&&s.stats.attack<=500&&s.stats.coffeeMax<=20&&Array.isArray(s.journal)&&s.journal.length<=30&&s.journal.every(x=>typeof x==='string')&&Number.isFinite(s.elapsed)}
function newGame(difficulty){if(!audio)audioInit();stats={level:1,xp:0,attack:18,maxHp:120,speed:0,skill:0,coffeeMax:3,submission:0,dignity:0,difficulty,deaths:0,secrets:0};journal=['入職：我只係想返份工，唔係賣埋個人。'];elapsed=0;chapter=0;startChapter(true)}
function loadSave(s){if(!audio)audioInit();stats={...s.stats};journal=[...s.journal];elapsed=s.elapsed;chapter=s.chapter;startChapter(true)}
function save(){checkpoint={version:1,chapter,stats:{...stats},journal:[...journal],elapsed};try{localStorage.setItem(SAVE_KEY,JSON.stringify(checkpoint))}catch{notify('瀏覽器未能存檔；本次仍可繼續遊玩。')}}
function notify(t){toast=t;toastTime=4}
function story(lines,done){let i=0;dialogDone=done;const advance=()=>{if(i>=lines.length){const cb=dialogDone;dialogDone=null;cb();return}const [who,line]=lines[i++];show('<p class="eyebrow">'+chapters[chapter].floor+' / '+chapters[chapter].name+'</p><h2>'+who+'</h2><p class="quote" style="font-size:19px;min-height:90px">'+line+'</p><div class="row" id="dialogbuttons"></div><p class="small">'+i+' / '+lines.length+' · Enter 繼續</p>','story');document.getElementById('dialogbuttons').append(button(i===lines.length?'行落去':'繼續',advance,'primary'))};advance()}
function startChapter(withStory){
 player={x:160,y:FLOOR-28,vx:0,vy:0,hp:stats.maxHp,energy:100,coffee:stats.coffeeMax,facing:1,grounded:true,jumps:0,attackCd:0,attackT:0,combo:0,comboWindow:0,dash:0,dashCd:0,inv:0,skillCd:0,grace:0};
 enemies=[];shots=[];particles=[];texts=[];hazards=[];pickups=[];camera=0;wave=0;waveDelay=3;bossSpawned=false;cleared=false;stageTime=0;endingChoice='';
 decor=Array.from({length:46},(_,i)=>({x:i*57,y:210+Math.sin(i*8.4)*90,w:36+i%3*15,h:160+i%5*16}));
 pickups=getPlatforms().map((p,i)=>({x:p.x+p.w/2,y:p.y-60,type:i===1?'coffee':'letter',taken:false}));
 save();const intro=()=>{hide();notify(chapter===0?'走到右邊。J 揮公事包，空白二段跳；閃避有短暫無敵。':'新一層已存檔 · 咖啡與生命已補滿')};
 if(withStory)story(chapters[chapter].lines,intro);else intro();
}
function floating(x,y,text,color=C.paper){texts.push({x,y,text,color,t:1.4})}
function puff(x,y,color,count=12){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*240,vy:(Math.random()-.7)*240,t:.35+Math.random()*.5,color,size:2+Math.random()*4})}
function getPlatforms(){return[{x:280,y:456,w:230},{x:940,y:436,w:240},{x:1640,y:448,w:240}]}
function levelUp(){stats.level++;stats.xp=0;show('<p class="eyebrow">生存技能 · LEVEL '+stats.level+'</p><h2>捱過一關。學識一樣嘢。</h2><p class="lede">升級唔一定要升職。揀一個能夠幫你行落去嘅能力。</p><div id="upgrades"></div>','upgrade');const picks=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);for(const u of picks){const b=button('',()=>{u.apply();hide();notify('學識：'+u.name)} ,'choice');b.innerHTML='<strong>'+u.name+'</strong><span>'+u.desc+'</span>';document.getElementById('upgrades').append(b)}}
function grantXP(n){stats.xp+=n;if(stats.xp>=70+stats.level*25&&mode==='play')levelUp()}
function employmentChoice(){
 const c=chapters[chapter];show('<p class="eyebrow">晉升抉擇 · '+(chapter+1)+' / 4</p><h2>你值得更好。代價呢？</h2><p class="quote">'+c.offer+'</p><div id="choices"></div><p class="small">選擇會留低。服從會令你更強，但亦令王座更熟悉你。</p>','choice');
 const choices=[{name:'「好呀，冇問題。」',desc:'奴性 +1；傷害 +5、生命上限 +15。力量嚟得快，枷鎖亦扣得實。',fn:()=>{stats.submission++;stats.attack+=5;stats.maxHp+=15;journal.push(c.name+'：我簽咗。下一次，或者先拒絕。')}},{name:'「唔好意思，我收工喇。」',desc:'尊嚴 +1；收工技增強、咖啡上限 +1。留返一啲力，畀自己同身邊人。',fn:()=>{stats.dignity++;stats.skill++;stats.coffeeMax++;journal.push(c.name+'：我拒絕咗。原來講「唔」唔會死。')}}];
 for(const ch of choices){let b=button('',()=>{ch.fn();chapter++;startChapter(true)},'choice');b.innerHTML='<strong>'+ch.name+'</strong><span>'+ch.desc+'</span>';document.getElementById('choices').append(b)}
}
function finishFloor(){cleared=true;shots=[];hazards=[];puff(player.x,player.y,C.gold,30);journal.push(chapters[chapter].name+'：搵返一塊放工鐘面。');notify(chapter===4?'王座已倒下。行到右邊，決定個鐘嘅去向。':'電梯開咗。行到最右邊按 E，帶住鐘面上樓。');player.hp=Math.min(stats.maxHp,player.hp+40)}
function exitFloor(){if(chapter===4){story(chapters[chapter].after,finalChoice)}else story(chapters[chapter].after,employmentChoice)}
function finalChoice(){show('<p class="eyebrow">17:59 → ?</p><h2>香港人最鍾意……</h2><p class="lede">王座空咗。四塊鐘面合返埋。你可以命令下一個人，或者容許所有人離開。</p><div id="endchoices"></div>','choice');const offers=[['返屋企','將鐘較到六點，同阿晴一齊開門。',()=>ending('home')],['做返自己','交低員工證。呢份工，已經唔值得你留。',()=>ending('leave')],['坐上王座','由今日起，由你批假、評核、叫人 OT。',()=>ending('chair')]];for(const [n,d,fn]of offers){const b=button('',fn,'choice');b.innerHTML='<strong>'+n+'</strong><span>'+d+'</span>';document.getElementById('endchoices').append(b)}}
function ending(type){
 endingChoice=type;const slave=stats.submission>=3;

const midiTracks=midiSources.map(s=>({...s,...parseMidi(s.data)}));
function audioInit(){

  const compressor=audio.createDynamicsCompressor();compressor.threshold.value=-18;compressor.knee.value=18;compressor.ratio.value=4;compressor.attack.value=.004;compressor.release.value=.18;
  masterBus=audio.createGain();masterBus.gain.value=.65;musicBus=audio.createGain();sfxBus=audio.createGain();musicBus.gain.value=.55;sfxBus.gain.value=.8;musicBus.connect(compressor);sfxBus.connect(compressor);compressor.connect(masterBus);masterBus.connect(audio.destination);

function tone(freq,duration,volume=.08,type='sine',endFreq=0,when=audio?.currentTime||0,bus=sfxBus){
 if(!audio||!soundOn)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(10,endFreq),when+duration);g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(volume,when+.004);g.gain.exponentialRampToValueAtTime(.0001,when+duration);o.connect(g);g.connect(bus);o.start(when);o.stop(when+duration+.02);o.onended=()=>{o.disconnect();g.disconnect()};

function noise(when,duration,volume,frequency,type='highpass',bus=sfxBus){

function drum(note,when,velocity=1,bus=musicBus){
 const v=velocity*.23;
 if(note<=36){tone(145,.19,v,'sine',40,when,bus);noise(when,.025,v*.4,1500,'lowpass',bus)}

 else if([42,44,46].includes(note)){noise(when,note===46?.17:.047,v*.38,7200,'highpass',bus)}

function midiVoice(n,when){

function sfx(kind){
 if(!soundOn||!audio)return;const t=audio.currentTime;
 switch(kind){

 case 'swish':noise(t,.09,.10,1800,'bandpass');tone(400,.07,.035,'triangle',140);break;
 case 'jump':tone(210,.075,.10,'square',480);tone(480,.065,.045,'triangle',660,t+.055);break;
 case 'dash':noise(t,.16,.16,3500,'highpass');tone(240,.11,.08,'sawtooth',65);break;
 case 'hurt':tone(140,.15,.15,'sawtooth',50);noise(t,.1,.14,1000,'lowpass');tone(74,.22,.12,'triangle',32);break;
 case 'collect':for(let i=0;i<3;i++)tone([523,659,784][i],.13,.09,'square',0,t+i*.065);break;
 case 'skill':tone(70,.45,.20,'sine',35);noise(t,.3,.2,1200,'bandpass');for(let i=0;i<5;i++)tone([220,330,440,660,880][i],.25,.065,'triangle',0,t+i*.045);break;

}
function music(){
 if(!audio||!soundOn)return;
 const active=['play','story','upgrade','choice'].includes(mode);if(!active){musicBus.gain.setTargetAtTime(.0001,audio.currentTime,.04);musicTrack=-1;return}
 const target=mode==='play'&&bossSpawned&&!cleared?1:0;
 const gain=mode==='play'?(target===1?1.35:1.1):.2;musicBus.gain.setTargetAtTime(gain,audio.currentTime,.14);
 if(musicTrack!==target){musicTrack=target;musicOrigin=audio.currentTime+.035;musicCursor=0;musicLoop=0}
 const track=midiTracks[target],now=audio.currentTime,horizon=now+.12;
 let count=0;while(count++<160){if(musicCursor>=track.notes.length){musicCursor=0;musicLoop++}const n=track.notes[musicCursor],when=musicOrigin+musicLoop*track.duration+n.time;if(when>horizon)break;if(when>=now-.04)midiVoice(n,Math.max(now+.002,when));musicCursor++}

document.getElementById('sound').onclick=()=>{if(soundOn){soundOn=false;masterBus?.gain.setTargetAtTime(.0001,audio.currentTime,.025);document.getElementById('sound').textContent='聲音：關';musicTrack=-1}else audioInit()};document.getElementById('pause').onclick=pauseGame;

function keyDown(e){if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)&&e.code!=='Tab')e.preventDefault();if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat){pauseGame();return}if(mode==='story'&&e.code==='Enter'){if(!e.repeat)panel.querySelector('button')?.click();e.preventDefault();return}if(mode==='play'){if(!keys.has(e.code))pressed.add(e.code);keys.add(e.code)}}
addEventListener('keydown',keyDown);addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{keys.clear();pressed.clear();if(mode==='play')pauseGame()});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();pressed.clear();if(mode==='play')pauseGame()}});
for(const b of document.querySelectorAll('[data-key]')){b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);const k=b.dataset.key;if(!keys.has(k))pressed.add(k);keys.add(k)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys.delete(b.dataset.key))}
